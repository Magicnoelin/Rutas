<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Corrección URLs de Imágenes</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .warning { background: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }
        .url-list { margin: 10px 0; padding: 10px; background: #f8f9fa; border-radius: 5px; }
        .url-item { margin: 5px 0; padding: 5px; background: white; border-left: 3px solid #007bff; }
        .btn { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 5px; }
        .btn:hover { background: #0056b3; }
        .loading { color: #666; font-style: italic; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Test de Corrección de URLs de Imágenes</h1>
        <p>Este script prueba si las URLs de imágenes se están generando correctamente después de las correcciones.</p>
        
        <div>
            <button class="btn" onclick="testAPI()">Test API Alojamientos</button>
            <button class="btn" onclick="testSpecific()">Test Alojamiento Específico</button>
            <button class="btn" onclick="testImages()">Verificar Imágenes</button>
        </div>

        <div id="results"></div>
    </div>

    <script>
        function log(message, type = 'info') {
            const resultsDiv = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.innerHTML = message;
            resultsDiv.appendChild(div);
        }

        async function testAPI() {
            log('🔄 Probando API de alojamientos...', 'loading');
            
            try {
                const response = await fetch('api/alojamientos.php?table=accommodations&limit=5');
                const data = await response.json();
                
                if (data.success && data.data.alojamientos) {
                    log('✅ API funcionando correctamente', 'success');
                    
                    // Analizar las URLs de fotos
                    const alojamientos = data.data.alojamientos;
                    let urlIssues = 0;
                    let urlCorrectas = 0;
                    
                    alojamientos.forEach(alojamiento => {
                        if (alojamiento.Fotos && alojamiento.Fotos.length > 0) {
                            const fotosDiv = document.createElement('div');
                            fotosDiv.className = 'url-list';
                            fotosDiv.innerHTML = `<strong>${alojamiento.Nombre || alojamiento.name}</strong>`;
                            
                            alojamiento.Fotos.forEach((foto, index) => {
                                const urlItem = document.createElement('div');
                                urlItem.className = 'url-item';
                                
                                // Verificar si la URL contiene problemas
                                if (foto.includes('%20https')) {
                                    urlItem.innerHTML = `❌ photo${index + 1}: ${foto} <br><small>⚠️ CONTIENE ESPACIO Y URL DUPLICADA</small>`;
                                    urlIssues++;
                                } else if (foto.startsWith('https://rutasrurales.io/Alojamientos_Images/https://')) {
                                    urlItem.innerHTML = `❌ photo${index + 1}: ${foto} <br><small>⚠️ URL DUPLICADA</small>`;
                                    urlIssues++;
                                } else if (foto.includes(' ')) {
                                    urlItem.innerHTML = `⚠️ photo${index + 1}: ${foto} <br><small>⚠️ CONTIENE ESPACIOS</small>`;
                                    urlIssues++;
                                } else {
                                    urlItem.innerHTML = `✅ photo${index + 1}: ${foto}`;
                                    urlCorrectas++;
                                }
                                
                                fotosDiv.appendChild(urlItem);
                            });
                            
                            resultsDiv.appendChild(fotosDiv);
                        }
                    });
                    
                    if (urlIssues > 0) {
                        log(`⚠️ Se encontraron ${urlIssues} URLs con problemas`, 'warning');
                    } else {
                        log(`✅ Todas las URLs (${urlCorrectas}) son correctas`, 'success');
                    }
                    
                } else {
                    log('❌ Error en la respuesta de la API: ' + (data.error || 'Respuesta inválida'), 'error');
                }
            } catch (error) {
                log('❌ Error al llamar a la API: ' + error.message, 'error');
            }
        }

        async function testSpecific() {
            log('🔄 Probando API específica...', 'loading');
            
            try {
                // Buscar un alojamiento que sepamos que existe
                const response = await fetch('api/search_accommodation.php?query=curro');
                const data = await response.json();
                
                if (data.success && data.data.results && data.data.results.length > 0) {
                    const alojamiento = data.data.results[0];
                    log(`✅ Encontrado: ${alojamiento.name}`, 'success');
                    
                    // Ahora probar el endpoint específico
                    const response2 = await fetch(`api/alojamiento-slug.php?slug=${alojamiento.slug}`);
                    const data2 = await response2.json();
                    
                    if (data2.success && data2.data) {
                        log('✅ API específica funcionando', 'success');
                        
                        if (data2.data.Fotos && data2.data.Fotos.length > 0) {
                            const fotosDiv = document.createElement('div');
                            fotosDiv.className = 'url-list';
                            fotosDiv.innerHTML = `<strong>Fotos de ${data2.data.Nombre}</strong>`;
                            
                            data2.data.Fotos.forEach((foto, index) => {
                                const urlItem = document.createElement('div');
                                urlItem.className = 'url-item';
                                
                                if (foto.includes('%20https') || foto.includes('https://rutasrurales.io/Alojamientos_Images/https://')) {
                                    urlItem.innerHTML = `❌ photo${index + 1}: ${foto} <br><small>⚠️ PROBLEMA DETECTADO</small>`;
                                } else {
                                    urlItem.innerHTML = `✅ photo${index + 1}: ${foto}`;
                                }
                                
                                fotosDiv.appendChild(urlItem);
                            });
                            
                            document.getElementById('results').appendChild(fotosDiv);
                        }
                    }
                } else {
                    log('⚠️ No se encontraron alojamientos con "curro"', 'warning');
                }
            } catch (error) {
                log('❌ Error: ' + error.message, 'error');
            }
        }

        async function testImages() {
            log('🔄 Verificando si las imágenes existen en el servidor...', 'loading');
            
            try {
                const response = await fetch('api/alojamientos.php?table=accommodations&limit=3');
                const data = await response.json();
                
                if (data.success && data.data.alojamientos) {
                    const alojamientos = data.data.alojamientos;
                    
                    for (const alojamiento of alojamientos) {
                        if (alojamiento.Fotos && alojamiento.Fotos.length > 0) {
                            for (const foto of alojamiento.Fotos) {
                                try {
                                    const imgResponse = await fetch(foto, { method: 'HEAD' });
                                    const status = imgResponse.ok ? '✅' : '❌';
                                    const statusText = imgResponse.status;
                                    
                                    log(`${status} ${foto} - Status: ${statusText}`, imgResponse.ok ? 'success' : 'error');
                                } catch (imgError) {
                                    log(`❌ ${foto} - Error: ${imgError.message}`, 'error');
                                }
                            }
                        }
                    }
                }
            } catch (error) {
                log('❌ Error al verificar imágenes: ' + error.message, 'error');
            }
        }
    </script>
</body>
</html>
