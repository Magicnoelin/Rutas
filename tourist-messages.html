<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensajes - Rutas Turismo Rural</title>
    <link rel="icon" href="menu_imagenes/Favicon.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .messages-wrapper {
            display: flex;
            min-height: 100vh;
            margin-top: 90px;
            background-color: #f5f5f5;
        }

        /* Conversations List */
        .conversations-sidebar {
            width: 350px;
            background: white;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: calc(100vh - 90px);
        }

        .conversations-header {
            padding: 1.5rem;
            border-bottom: 1px solid #e0e0e0;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
        }

        .conversations-header h2 {
            margin: 0 0 1rem 0;
            font-size: 1.5rem;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 0.8rem 1rem 0.8rem 2.5rem;
            border: none;
            border-radius: 25px;
            background: rgba(255,255,255,0.2);
            color: white;
            font-size: 0.9rem;
        }

        .search-box input::placeholder {
            color: rgba(255,255,255,0.7);
        }

        .search-box i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.7);
        }

        .conversations-tabs {
            display: flex;
            border-bottom: 1px solid #e0e0e0;
            background: white;
        }

        .tab-btn {
            flex: 1;
            padding: 1rem;
            border: none;
            background: none;
            cursor: pointer;
            font-weight: 600;
            color: #666;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
        }

        .tab-btn.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }

        .conversations-list {
            flex: 1;
            overflow-y: auto;
        }

        .conversation-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .conversation-item:hover {
            background-color: #f9f9f9;
        }

        .conversation-item.active {
            background-color: #e8f5e9;
            border-left: 4px solid var(--primary-color);
        }

        .conversation-item.unread {
            background-color: #f0f8ff;
        }

        .conversation-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--primary-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
            position: relative;
        }

        .online-indicator {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            background: #4caf50;
            border: 2px solid white;
            border-radius: 50%;
        }

        .conversation-info {
            flex: 1;
            min-width: 0;
        }

        .conversation-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.3rem;
        }

        .conversation-name {
            font-weight: 600;
            color: var(--primary-color);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .conversation-time {
            font-size: 0.75rem;
            color: #999;
            flex-shrink: 0;
        }

        .conversation-preview {
            color: #666;
            font-size: 0.85rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .conversation-item.unread .conversation-preview {
            font-weight: 600;
            color: var(--primary-color);
        }

        .unread-badge {
            background: var(--primary-color);
            color: white;
            border-radius: 12px;
            padding: 0.2rem 0.6rem;
            font-size: 0.7rem;
            font-weight: bold;
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            margin-left: 350px;
            display: flex;
            flex-direction: column;
            background: white;
        }

        .chat-header {
            padding: 1.5rem;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
        }

        .chat-header-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .chat-header-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--primary-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .chat-header-details h3 {
            margin: 0 0 0.2rem 0;
            color: var(--primary-color);
            font-size: 1.2rem;
        }

        .chat-header-details p {
            margin: 0;
            color: #666;
            font-size: 0.85rem;
        }

        .chat-actions {
            display: flex;
            gap: 0.5rem;
        }

        .chat-action-btn {
            width: 40px;
            height: 40px;
            border: none;
            background: #f0f0f0;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .chat-action-btn:hover {
            background: var(--primary-color);
            color: white;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            background: #f9f9f9;
        }

        .message-group {
            margin-bottom: 2rem;
        }

        .message-date {
            text-align: center;
            color: #999;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }

        .message {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            animation: fadeIn 0.3s ease;
        }

        .message.sent {
            flex-direction: row-reverse;
        }

        .message-avatar-small {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: var(--primary-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .message.sent .message-avatar-small {
            background: var(--accent-color);
        }

        .message-bubble {
            max-width: 60%;
            padding: 1rem 1.2rem;
            border-radius: 18px;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .message.sent .message-bubble {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
        }

        .message-text {
            margin-bottom: 0.5rem;
            line-height: 1.5;
        }

        .message-meta {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            color: #999;
        }

        .message.sent .message-meta {
            color: rgba(255,255,255,0.8);
            justify-content: flex-end;
        }

        .message-status {
            display: flex;
            align-items: center;
            gap: 0.2rem;
        }

        /* Offer Card */
        .offer-card {
            background: #fff3e0;
            border: 2px solid #ff9800;
            border-radius: 12px;
            padding: 1rem;
            margin-top: 0.5rem;
        }

        .offer-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #f57c00;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .offer-details {
            color: #333;
            margin-bottom: 1rem;
        }

        .offer-actions {
            display: flex;
            gap: 0.5rem;
        }

        .offer-btn {
            flex: 1;
            padding: 0.6rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .offer-btn.accept {
            background: #4caf50;
            color: white;
        }

        .offer-btn.accept:hover {
            background: #45a049;
        }

        .offer-btn.reject {
            background: #f44336;
            color: white;
        }

        .offer-btn.reject:hover {
            background: #da190b;
        }

        /* Chat Input */
        .chat-input-area {
            padding: 1.5rem;
            border-top: 1px solid #e0e0e0;
            background: white;
        }

        .chat-input-wrapper {
            display: flex;
            gap: 1rem;
            align-items: flex-end;
        }

        .input-actions {
            display: flex;
            gap: 0.5rem;
        }

        .input-action-btn {
            width: 40px;
            height: 40px;
            border: none;
            background: #f0f0f0;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .input-action-btn:hover {
            background: var(--secondary-color);
            color: white;
        }

        .input-container {
            flex: 1;
            position: relative;
        }

        .chat-input {
            width: 100%;
            padding: 1rem 3rem 1rem 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 1rem;
            resize: none;
            max-height: 120px;
            font-family: inherit;
        }

        .chat-input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .send-btn {
            width: 50px;
            height: 50px;
            border: none;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }

        .send-btn:hover {
            transform: scale(1.1);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Empty State */
        .empty-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #999;
            padding: 2rem;
        }

        .empty-chat i {
            font-size: 5rem;
            margin-bottom: 1rem;
            opacity: 0.3;
        }

        .empty-chat h3 {
            margin-bottom: 0.5rem;
            color: #666;
        }

        /* Typing Indicator */
        .typing-indicator {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .typing-dots {
            display: flex;
            gap: 0.3rem;
            padding: 1rem 1.2rem;
            background: white;
            border-radius: 18px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #999;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-10px);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .conversations-sidebar {
                width: 100%;
                position: relative;
                height: auto;
            }

            .chat-area {
                margin-left: 0;
            }

            .messages-wrapper {
                flex-direction: column;
            }

            .message-bubble {
                max-width: 80%;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <nav class="navbar">
            <div class="container">
                <div class="logo">
                    <img src="menu_imagenes/Logo%20transparente.webp" alt="Rutas Logo">
                    <div class="logo-text">
                        <span class="logo-title">Rutas</span>
                        <span class="logo-subtitle">Red Unificada de Turistas, Alojamientos y Servicios</span>
                    </div>
                </div>
                <ul class="nav-menu">
                    <li><a href="index.html"><i class="fas fa-home"></i> Inicio</a></li>
                    <li><a href="tourist-dashboard.html"><i class="fas fa-user-circle"></i> Mi Panel</a></li>
                    <li><a href="tourist-messages.html" class="active"><i class="fas fa-envelope"></i> Mensajes</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <!-- Messages Wrapper -->
    <div class="messages-wrapper">
        <!-- Conversations Sidebar -->
        <aside class="conversations-sidebar">
            <div class="conversations-header">
                <h2><i class="fas fa-envelope"></i> Mensajes</h2>
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Buscar conversaciones..." id="searchInput">
                </div>
            </div>

            <div class="conversations-tabs">
                <button class="tab-btn active" onclick="filterConversations('all')">
                    Todos
                </button>
                <button class="tab-btn" onclick="filterConversations('unread')">
                    No leídos <span class="unread-badge">3</span>
                </button>
            </div>

            <div class="conversations-list" id="conversationsList">
                <!-- Conversations will be loaded here -->
            </div>
        </aside>

        <!-- Chat Area -->
        <main class="chat-area" id="chatArea">
            <div class="empty-chat">
                <i class="fas fa-comments"></i>
                <h3>Selecciona una conversación</h3>
                <p>Elige una conversación de la lista para comenzar a chatear</p>
            </div>
        </main>
    </div>

    <script>
        // Datos de ejemplo
        const conversations = [
            {
                id: 1,
                name: 'Casa Rural El Pinar',
                type: 'accommodation',
                avatar: 'home',
                lastMessage: 'Tenemos una oferta especial para ti este fin de semana',
                time: '10:30',
                unread: 2,
                online: true,
                messages: [
                    {
                        id: 1,
                        sender: 'provider',
                        text: '¡Hola! Gracias por tu interés en Casa Rural El Pinar',
                        time: '10:15',
                        date: 'Hoy'
                    },
                    {
                        id: 2,
                        sender: 'provider',
                        text: 'Tenemos una oferta especial para ti este fin de semana',
                        time: '10:16',
                        date: 'Hoy',
                        offer: {
                            title: 'Oferta Fin de Semana',
                            description: '2 noches + desayuno por solo 150€ (ahorro de 50€)',
                            validUntil: '25/01/2026'
                        }
                    },
                    {
                        id: 3,
                        sender: 'user',
                        text: '¡Me interesa! ¿Incluye todas las comidas?',
                        time: '10:30',
                        date: 'Hoy',
                        status: 'read'
                    }
                ]
            },
            {
                id: 2,
                name: 'Ruta del Cañón del Río Lobos',
                type: 'activity',
                avatar: 'hiking',
                lastMessage: 'Nueva actividad de senderismo disponible',
                time: 'Ayer',
                unread: 1,
                online: false,
                messages: [
                    {
                        id: 1,
                        sender: 'provider',
                        text: 'Nueva actividad de senderismo disponible para el próximo sábado',
                        time: '15:20',
                        date: 'Ayer'
                    }
                ]
            },
            {
                id: 3,
                name: 'Festival de Música Folk',
                type: 'event',
                avatar: 'calendar',
                lastMessage: 'Confirmación de tu interés en el evento',
                time: '2 días',
                unread: 0,
                online: true,
                messages: [
                    {
                        id: 1,
                        sender: 'user',
                        text: 'Hola, me gustaría más información sobre el festival',
                        time: '12:00',
                        date: '20/01/2026',
                        status: 'read'
                    },
                    {
                        id: 2,
                        sender: 'provider',
                        text: 'Claro, el festival será los días 15-16 de febrero. Tenemos entradas disponibles.',
                        time: '12:30',
                        date: '20/01/2026'
                    }
                ]
            }
        ];

        let currentConversation = null;

        // Cargar conversaciones
        function loadConversations() {
            const container = document.getElementById('conversationsList');
            container.innerHTML = conversations.map(conv => `
                <div class="conversation-item ${conv.unread > 0 ? 'unread' : ''}" onclick="openConversation(${conv.id})">
                    <div class="conversation-avatar">
                        <i class="fas fa-${conv.avatar}"></i>
                        ${conv.online ? '<span class="online-indicator"></span>' : ''}
                    </div>
                    <div class="conversation-info">
                        <div class="conversation-header">
                            <span class="conversation-name">${conv.name}</span>
                            <span class="conversation-time">${conv.time}</span>
                        </div>
                        <div class="conversation-preview">${conv.lastMessage}</div>
                    </div>
                    ${conv.unread > 0 ? `<span class="unread-badge">${conv.unread}</span>` : ''}
                </div>
            `).join('');
        }

        // Abrir conversación
        function openConversation(id) {
            currentConversation = conversations.find(c => c.id === id);
            if (!currentConversation) return;

            // Marcar como activa
            document.querySelectorAll('.conversation-item').forEach(item => {
                item.classList.remove('active');
            });
            event.currentTarget.classList.add('active');

            // Marcar como leída
            currentConversation.unread = 0;
            event.currentTarget.classList.remove('unread');
            const badge = event.currentTarget.querySelector('.unread-badge');
            if (badge) badge.remove();

            // Renderizar chat
            renderChat();
        }

        // Renderizar chat
        function renderChat() {
            const chatArea = document.getElementById('chatArea');
            
            chatArea.innerHTML = `
                <div class="chat-header">
                    <div class="chat-header-info">
                        <div class="chat-header-avatar">
                            <i class="fas fa-${currentConversation.avatar}"></i>
                        </div>
                        <div class="chat-header-details">
                            <h3>${currentConversation.name}</h3>
                            <p>${currentConversation.online ? '<i class="fas fa-circle" style="color: #4caf50; font-size: 0.6rem;"></i> En línea' : 'Desconectado'}</p>
                        </div>
                    </div>
                    <div class="chat-actions">
                        <button class="chat-action-btn" title="Información">
                            <i class="fas fa-info-circle"></i>
                        </button>
                        <button class="chat-action-btn" title="Más opciones">
                            <i class="fas fa-ellipsis-v"></i>
                        </button>
                    </div>
                </div>

                <div class="chat-messages" id="chatMessages">
                    ${renderMessages()}
                </div>

                <div class="chat-input-area">
                    <div class="chat-input-wrapper">
                        <div class="input-actions">
                            <button class="input-action-btn" title="Adjuntar archivo">
                                <i class="fas fa-paperclip"></i>
                            </button>
                            <button class="input-action-btn" title="Enviar oferta">
                                <i class="fas fa-gift"></i>
                            </button>
                        </div>
                        <div class="input-container">
                            <textarea 
                                class="chat-input" 
                                id="messageInput" 
                                placeholder="Escribe un mensaje..."
                                rows="1"
                                onkeypress="handleKeyPress(event)"
                            ></textarea>
                        </div>
                        <button class="send-btn" onclick="sendMessage()">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            `;

            // Scroll al final
            const messagesContainer = document.getElementById('chatMessages');
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Renderizar mensajes
        function renderMessages() {
            return currentConversation.messages.map(msg => {
                const isSent = msg.sender === 'user';
                return `
                    <div class="message ${isSent ? 'sent' : ''}">
                        <div class="message-avatar-small">
                            <i class="fas fa-${isSent ? 'user' : currentConversation.avatar}"></i>
                        </div>
                        <div class="message-bubble">
                            <div class="message-text">${msg.text}</div>
                            ${msg.offer ? renderOffer(msg.offer) : ''}
                            <div class="message-meta">
                                <span>${msg.time}</span>
                                ${isSent ? `
                                    <span class="message-status">
                                        <i class="fas fa-check-double" style="color: ${msg.status === 'read' ? '#4caf50' : 'inherit'}"></i>
                                    </span>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Renderizar oferta
        function renderOffer(offer) {
            return `
                <div class="offer-card">
                    <div class="offer-header">
                        <i class="fas fa-gift"></i>
                        ${offer.title}
                    </div>
                    <div class="offer-details">
                        ${offer.description}<br>
                        <small>Válido hasta: ${offer.validUntil}</small>
                    </div>
                    <div class="offer-actions">
                        <button class="offer-btn accept" onclick="acceptOffer()">
                            <i class="fas fa-check"></i> Aceptar
                        </button>
                        <button class="offer-btn reject" onclick="rejectOffer()">
                            <i class="fas fa-times"></i> Rechazar
                        </button>
                    </div>
                </div>
            `;
        }

        // Enviar mensaje
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            
            if (!text || !currentConversation) return;

            const newMessage = {
                id: currentConversation.messages.length + 1,
                sender: 'user',
                text: text,
                time: new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }),
                date: 'Hoy',
                status: 'sent'
            };

            currentConversation.messages.push(newMessage);
            currentConversation.lastMessage = text;
            
            input.value = '';
            renderChat();

            // Simular respuesta
            setTimeout(() => {
                showTypingIndicator();
                setTimeout(() => {
                    const response = {
                        id: currentConversation.messages.length + 1,
                        sender: 'provider',
                        text: '¡Gracias por tu mensaje! Te responderemos pronto.',
                        time: new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }),
                        date: 'Hoy'
                    };
                    currentConversation.messages.push(response);
                    renderChat();
                }, 2000);
            }, 1000);
        }

        // Mostrar indicador de escritura
        function showTypingIndicator() {
            const messagesContainer = document.getElementById('chatMessages');
            const indicator = document.createElement('div');
            indicator.className = 'typing-indicator';
            indicator.innerHTML = `
                <div class="message-avatar-small">
                    <i class="fas fa-${currentConversation.avatar}"></i>
                </div>
                <div class="typing-dots">
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                </div>
            `;
            messagesContainer.appendChild(indicator);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Manejar Enter
        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }
