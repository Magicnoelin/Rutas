<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Ultra Simple</title>
    <style>
        body { font-family: Arial; padding: 20px; max-width: 500px; margin: 0 auto; }
        .step { margin: 15px 0; padding: 10px; border: 1px solid #ccc; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        .ok { background: #4CAF50; color: white; }
        .disabled { background: #ccc; cursor: not-allowed; }
        .info { background: #e3f2fd; padding: 10px; margin: 5px 0; }
        .error { background: #ffebee; padding: 10px; margin: 5px 0; }
        .success { background: #e8f5e8; padding: 10px; margin: 5px 0; }
    </style>
</head>
<body>
    <h2>🔍 Test Ultra Simple</h2>
    
    <div class="step">
        <strong>1. Categoría:</strong>
        <button onclick="setCategory('salon')">Salón</button>
        <button onclick="setCategory('cocina')">Cocina</button>
        <div id="cat" class="info">Sin categoría</div>
    </div>

    <div class="step">
        <strong>2. Archivo:</strong>
        <input type="file" id="file" accept="image/*">
        <div id="fileInfo" class="info">Sin archivo</div>
    </div>

    <div class="step">
        <strong>3. Slug:</strong>
        <input type="text" id="slug" placeholder="Ej: mi-alojamiento" style="width: 100%; padding: 5px;">
        <div id="slugInfo" class="info">Sin slug</div>
    </div>

    <div class="step">
        <strong>4. Botón:</strong><br>
        <button id="btn" onclick="upload()" disabled class="disabled">SUBIR FOTO</button>
        <div id="status" class="info">Esperando...</div>
    </div>

    <div id="result"></div>

    <script>
        let cat = '';
        let file = null;
        let slug = '';

        function setCategory(c) {
            cat = c;
            document.getElementById('cat').textContent = 'Categoría: ' + c;
            check();
        }

        document.getElementById('file').addEventListener('change', function(e) {
            file = e.target.files[0];
            if (file) {
                document.getElementById('fileInfo').textContent = 'Archivo: ' + file.name;
            }
            check();
        });

        document.getElementById('slug').addEventListener('input', function(e) {
            slug = e.target.value.trim();
            document.getElementById('slugInfo').textContent = 'Slug: ' + slug;
            check();
        });

        function check() {
            const btn = document.getElementById('btn');
            const status = document.getElementById('status');
            
            const ready = cat && file && slug;
            
            btn.disabled = !ready;
            btn.className = ready ? 'ok' : 'disabled';
            
            if (ready) {
                status.textContent = '✅ LISTO PARA SUBIR';
                status.className = 'success';
            } else {
                let missing = [];
                if (!cat) missing.push('categoría');
                if (!file) missing.push('archivo');
                if (!slug) missing.push('slug');
                status.textContent = '❌ Faltan: ' + missing.join(', ');
                status.className = 'error';
            }
        }

        async function upload() {
            if (!cat || !file || !slug) {
                alert('Faltan datos');
                return;
            }

            const result = document.getElementById('result');
            result.innerHTML = '<div class="info">⏳ Subiendo...</div>';

            try {
                const formData = new FormData();
                formData.append('accommodation_identifier', slug);
                formData.append('photo_category', cat);
                formData.append('photo', file);

                const response = await fetch('api/upload_accommodation_photo.php', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    result.innerHTML = `
                        <div class="success">
                            <h3>✅ ÉXITO</h3>
                            <p><strong>URL:</strong> ${data.data.url}</p>
                            <p><strong>Categoría:</strong> ${data.data.category}</p>
                            <p><strong>Archivo:</strong> ${data.data.filename}</p>
                        </div>
                    `;
                } else {
                    result.innerHTML = `<div class="error">❌ Error: ${data.error}</div>`;
                }
            } catch (e) {
                result.innerHTML = `<div class="error">❌ Error: ${e.message}</div>`;
            }
        }
    </script>
</body>
</html>
