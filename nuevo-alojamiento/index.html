            --blanco: #FFFFFF;

            background: var(--blanco);
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        
        /* Prevent layout shifts */
        img {
            max-width: 100%;
            height: auto;
        }
        
        /* Loading skeleton */
        #galeria {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 10px;
            min-height: 200px;
        }
        
        .gallery-item {
            background: #f0f0f0;
            border-radius: 8px;
            height: 200px;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
