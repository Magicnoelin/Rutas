<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Página Real de Actividad</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test { background: #f5f5f5; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .success { color: green; font-weight: bold; }
        .error { color: red; font-weight: bold; }
        iframe { width: 100%; height: 500px; border: 2px solid #ccc; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>Test de Página Real de Actividad</h1>
    
    <div class="test">
        <h2>Probar Página de Actividad Directamente</h2>
        <p>Esta prueba carga la página real de actividad en un iframe y verifica su contenido.</p>
        
        <h3>Opciones de prueba:</h3>
        <button onclick="testActivity('kayak-cuerda-del-pozo')">Probar: kayak-cuerda-del-pozo</button>
        <button onclick="testActivity('micologia-picos-urbion')">Probar: micologia-picos-urbion</button>
        <button onclick="testActivity('test-actividad-123')">Probar: actividad inexistente</button>
        
        <div id="testResult"></div>
    </div>
    
    <div class="test">
        <h2>Iframe de Prueba</h2>
        <iframe id="activityFrame" src="about:blank"></iframe>
    </div>
    
    <div class="test">
        <h2>Verificar Archivos en Servidor</h2>
        <p id="fileCheck">Comprobando archivos...</p>
        <button onclick="checkFiles()">Verificar Archivos</button>
    </div>

    <script>
        function testActivity(slug) {
            const frame = document.getElementById('activityFrame');
            const testResult = document.getElementById('testResult');
            
            testResult.innerHTML = `Cargando actividad: <strong>${slug}</strong>...`;
            
            // Cargar la página real de actividad
            frame.src = `/actividad/${slug}`;
            
            // Esperar a que cargue y verificar contenido
            frame.onload = function() {
                try {
                    const frameDoc = frame.contentDocument || frame.contentWindow.document;
                    
                    // Verificar elementos clave
                    const actividadContent = frameDoc.getElementById('actividadContent');
                    const loading = frameDoc.getElementById('loading');
                    const error = frameDoc.getElementById('error');
                    
                    let resultHTML = `<h3>Resultado para "${slug}":</h3>`;
                    
                    if (!actividadContent) {
                        resultHTML += `<p class="error">✗ ERROR: No se encontró el elemento 'actividadContent'</p>`;
                        resultHTML += `<p>Esto significa que el archivo actividad.html no tiene la estructura correcta.</p>`;
                    } else {
                        const isVisible = actividadContent.style.display !== 'none';
                        resultHTML += `<p>Elemento 'actividadContent': ${actividadContent ? '✓ Encontrado' : '✗ No encontrado'}</p>`;
                        resultHTML += `<p>Visible: ${isVisible ? '✓ Sí' : '✗ No'}</p>`;
                    }
                    
                    if (loading) {
                        const isLoading = loading.style.display !== 'none';
                        resultHTML += `<p>Elemento 'loading': ${isLoading ? '⏳ Mostrando' : '✓ Oculto'}</p>`;
                    }
                    
                    if (error) {
                        const hasError = error.style.display !== 'none';
                        resultHTML += `<p>Elemento 'error': ${hasError ? `⚠️ Mostrando: ${error.textContent}` : '✓ Oculto'}</p>`;
                    }
                    
                    // Verificar título de la página
                    const pageTitle = frameDoc.title;
                    resultHTML += `<p>Título de página: "${pageTitle}"</p>`;
                    
                    // Verificar si hay JavaScript errors en la consola del iframe
                    try {
                        const scripts = frameDoc.querySelectorAll('script');
                        resultHTML += `<p>Scripts encontrados: ${scripts.length}</p>`;
                    } catch (e) {
                        resultHTML += `<p class="error">✗ No se puede acceder al contenido del iframe (posible CORS)</p>`;
                    }
                    
                    testResult.innerHTML = resultHTML;
                    
                } catch (e) {
                    testResult.innerHTML = `<p class="error">✗ Error al analizar iframe: ${e.message}</p>`;
                }
            };
            
            frame.onerror = function() {
                testResult.innerHTML = `<p class="error">✗ Error al cargar la página de actividad</p>`;
            };
        }
        
        function checkFiles() {
            const fileCheck = document.getElementById('fileCheck');
            fileCheck.innerHTML = 'Comprobando archivos...';
            
            // Verificar archivos clave
            const filesToCheck = [
                '/actividad.html',
                '/.htaccess',
                '/api/actividad.php',
                '/api/actividad-slug.php',
                '/redirect_manager.php'
            ];
            
            let results = [];
            let checked = 0;
            
            filesToCheck.forEach(file => {
                fetch(file, { method: 'HEAD' })
                    .then(response => {
                        results.push(`${file}: ${response.status === 200 ? '✓ Existe' : `✗ No existe (${response.status})`}`);
                        checked++;
                        
                        if (checked === filesToCheck.length) {
                            fileCheck.innerHTML = '<strong>Archivos en servidor:</strong><br>' + results.join('<br>');
                        }
                    })
                    .catch(error => {
                        results.push(`${file}: ✗ Error: ${error.message}`);
                        checked++;
                        
                        if (checked === filesToCheck.length) {
                            fileCheck.innerHTML = '<strong>Archivos en servidor:</strong><br>' + results.join('<br>');
                        }
                    });
            });
        }
        
        // Ejecutar verificación de archivos al cargar
        window.onload = checkFiles;
    </script>
</body>
</html>
