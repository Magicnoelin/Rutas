        /* Fuentes locales Montserrat - cargadas desde el servidor */
        @font-face {
            font-family: 'Montserrat';

        @font-face {
            font-family: 'Montserrat';

            font-display: swap;
            src: local('Montserrat Medium'), local('Montserrat-Medium'), url('/fonts/montserrat-v31-latin-500.woff2') format('woff2');
        }
        @font-face {
            font-family: 'Montserrat';

        :root {
            --rr-verde-lima: #8eac17;
            --rr-verde-oscuro: #246634;
            --rr-beige: #f7e0bc;
            --rr-cian: #dff6fa;
            --white: #ffffff;
            --text-dark: #2d3436;
            --accent-color: #B8956A;
        }

        body { background-color: #fcfcfc; color: var(--text-dark); }

        /* --- HEADER MENU COMPLETO --- */
        #navMenu a, #navMenu a:visited, #navMenu a:active {
            text-decoration: none !important;
            color: inherit !important;
            -webkit-tap-highlight-color: transparent;
        }

        /* DISEÑO PARA PC */
        @media (min-width: 993px) {
            .hamburger { display: none !important; }
            .nav-menu {
                display: flex !important;
                flex-direction: column;
                gap: 10px;
                align-items: center;
                font-family: 'Montserrat', sans-serif;
                margin-left: auto;
            }
            .nav-row {
                display: flex !important;
                list-style: none !important;
                margin: 0; padding: 0;
                width: 650px;
                justify-content: center;
            }
            .nav-row li { flex: 1; text-align: center; }
            .nav-row li a {
                font-size: 0.9rem;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                text-transform: capitalize;
                color: var(--accent-color) !important;
                font-weight: 600;
            }
            .nav-row li a span {
                color: var(--accent-color) !important;
            }
            .nav-row li a i {
                color: var(--accent-color) !important;
                font-size: 1.1rem;
            }
            .nav-row li a:hover, .nav-row li a:hover span, .nav-row li a:hover i {
                color: #ffffff !important;
            }
        }

        /* DISEÑO PARA MÓVIL */
        @media (max-width: 992px) {
            html, body {
                overflow-x: hidden !important;
                width: 100% !important;
                position: relative;
            }

            .header, .navbar { 
                height: auto !important; 
                padding: 2px 0 !important; 
                position: fixed !important;
                top: 0 !important;
                width: 100% !important;
                z-index: 9999 !important;
                background-color: #2c5f2d !important;
            }
            
            .navbar .container {
                flex-direction: row !important;
                justify-content: flex-start !important;
                align-items: center !important;
                gap: 5px !important;
                padding: 0 5px !important;
                display: flex !important;
                width: 100% !important;
            }

            .logo {
                flex-shrink: 0 !important;
                margin-right: 2px !important;
                display: block !important;
            }

            .logo img {
                height: 35px !important;
                width: auto !important;
            }

            .logo-text {
                display: none !important;
            }

            .nav-menu {
                display: flex !important;
                position: static !important; 
                width: auto !important;
                height: auto !important;
                background: transparent !important;
                flex-direction: column !important;
                flex: 1 !important;
                gap: 1px !important;
                padding: 0 !important;
                margin: 0 !important;
                box-shadow: none !important;
            }

            .nav-row {
                display: grid !important;
                grid-template-columns: repeat(4, 1fr) !important;
                gap: 2px !important;
                width: 100% !important;
                list-style: none !important;
                padding: 0 !important;
                margin: 0 !important;
            }

            .nav-row li {
                display: block !important;
            }

            .nav-row li a {
                background: rgba(255, 255, 255, 0.1) !important;
                min-height: 30px !important;
                padding: 1px !important;
                border-radius: 4px !important;
                display: flex !important;
                flex-direction: column !important;
                align-items: center !important;
                justify-content: center;
            }

            .nav-row li a span {
                font-size: 0.50rem !important;
                font-weight: 600 !important;
                line-height: 1 !important;
                text-align: center !important;
                white-space: nowrap !important;
                color: #d4a574 !important;
                margin: 0 !important;
            }

            .nav-row li a i {
                font-size: 0.8rem !important;
                margin-bottom: 0px !important;
                color: #ffffff !important;
            }

            input[type="text"], input[type="number"], input[type="search"], textarea, select {
                font-size: 16px !important;
            }
        }

        .asistente-avatar {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid #ffffff;
            vertical-align: middle;
        }

        @media (max-width: 992px) {
            .asistente-avatar {
                width: 18px !important;
                height: 18px !important;
                margin-bottom: 0px;
            }
        }

        /* Contenedor Limpio */
        .event-wrapper { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        .main-card { 
            background: var(--white); 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.04); 
            overflow: hidden;
            margin-bottom: 40px;
        }

        /* Galería Estilo Pro */
        .gallery-frame { position: relative; height: 500px; background: #eee; }
        .gallery-img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .gallery-img.active { display: block; animation: fadeIn 0.8s; }

        /* Títulos */
        .event-info-header { padding: 40px; text-align: center; }
        .event-info-header h1 { font-size: 3rem; color: var(--rr-verde-oscuro); margin-bottom: 10px; font-weight: 800; }
        
        /* SECCIONES DE GANCHO (MODERNAS) */
        .experience-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 40px; }
        
        .hook-card {
            background: var(--white);
            padding: 30px;
            border-radius: 15px;
            border: 1px solid #eee;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .hook-card:hover { border-color: var(--rr-verde-lima); transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .hook-card h3 { color: var(--rr-verde-oscuro); margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .hook-card i { color: var(--rr-verde-lima); font-size: 1.5rem; }

        /* Botón Estilo Rutas Rurales */
        .btn-rr {
            display: inline-block;
            padding: 12px 25px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            text-align: center;
            transition: 0.3s;
            border: none;
            cursor: pointer;
        }
        .btn-rr-primary { background: var(--rr-verde-lima); color: white; }
        .btn-rr-outline { border: 2px solid var(--rr-verde-lima); color: var(--rr-verde-oscuro); }
        .btn-rr:hover { opacity: 0.9; transform: scale(1.02); }

        /* Banner de Registro (Sutil pero efectivo) */
        .registration-invite {
            background: var(--rr-cian);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            margin: 60px 0;
            position: relative;
            overflow: hidden;
        }
        .registration-invite::before {
            content: '🥧'; position: absolute; font-size: 10rem; opacity: 0.1; right: -20px; bottom: -20px;
        }

        /* Compartir WhatsApp */
        .share-bar {
            background: #f8f9fa;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid #eee;
        }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @media (max-width: 768px) { .event-info-header h1 { font-size: 2rem; } }

    <main class="event-wrapper" style="margin-top: 100px;">
        <div id="loading" style="text-align: center; padding: 5rem;">
            <i class="fas fa-spinner fa-spin fa-3x" style="color: var(--rr-verde-lima);"></i>
        </div>

        <div id="detail-content" style="display: none;">
            </div>
    </main>

    <script>
        async function fetchEvento(slug) {
            try {
                const response = await fetch('/api/evento-detalle.php?slug=' + slug);
                const data = await response.json();
                if (data.success) renderEvento(data.data);
            } catch (error) { console.error(error); }
        }

        function renderEvento(evento) {
            document.getElementById('loading').style.display = 'none';
            const container = document.getElementById('detail-content');
            container.style.display = 'block';
            
            const shareMsg = encodeURIComponent(`¡Mira qué planazo! 🥧 ${evento.titulo} en ${evento.localidad}. ¿Nos vamos? ${window.location.href}`);

            container.innerHTML = `
                <div class="main-card">
                    <div class="gallery-frame">
                        ${(evento.fotos || []).map((f, i) => `<img src="${f}" class="gallery-img ${i===0?'active':''}">`).join('')}
                    </div>
                    
                    <div class="event-info-header">
                        <span style="color: var(--rr-verde-lima); font-weight: 700; text-transform: uppercase;">${evento.categoria_nombre}</span>
                        <h1>${evento.titulo}</h1>
                        <p><i class="fas fa-map-marker-alt"></i> ${evento.localidad}, ${evento.provincia}</p>
                    </div>

                    <div class="share-bar">
                        <span>¿Te gusta el plan? <strong>¡Pásalo!</strong></span>
                        <a href="https://api.whatsapp.com/send?text=${shareMsg}" target="_blank" class="btn-rr" style="background:#25D366; color:white;">
                            <i class="fab fa-whatsapp"></i> Compartir con amigos
                        </a>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 40px;">
                    <div>
                        <h2 style="color: var(--rr-verde-oscuro); margin-bottom: 20px;">Sobre el evento</h2>
                        <div style="line-height: 1.8; font-size: 1.1rem;">${evento.descripcion}</div>
                        
                        <div style="margin-top: 40px; padding: 30px; border-radius: 15px; background: var(--rr-beige);">
                            <h3>¿Tienes una foto de 10? 🌟</h3>
                            <p>Presume de planazo. Te publicamos en la web con link a tu Instagram para que crezcas con nosotros.</p>
                            <a href="/registro-fotografo.html" class="btn-rr btn-rr-outline" style="margin-top: 15px;">Subir mis fotos</a>
                        </div>
                    </div>

                    <aside>
                        <div class="hook-card">
                            <h3><i class="fas fa-bed"></i> ¿Vienes de fuera?</h3>
                            <p>No te des el palizón de volver en el día. Echa un ojo a los alojamientos disponibles.</p>
                            <a href="/alojamientos-turisticos.html?provincia=${evento.provincia}" class="btn-rr btn-rr-primary">Ver Alojamientos</a>
                        </div>

                        <div class="hook-card" style="margin-top: 20px; border-left: 5px solid var(--rr-verde-lima);">
                            <h3><i class="fas fa-map-signs"></i> Explora la zona</h3>
                            <p>Descubre rutas increíbles en un radio a la redonda de ${evento.localidad}.</p>
                            <a href="/rutas.html" class="btn-rr btn-rr-outline">Ver rutas cercanas</a>
                        </div>
                    </div>
                </div>

                <div class="registration-invite">
                    <h2 style="color: var(--rr-verde-oscuro);">Diseña tu escapada perfecta</h2>
                    <p style="max-width: 600px; margin: 15px auto; font-size: 1.1rem;">
                        Usa nuestra herramienta <strong>Mi Ruta</strong> para organizar tus paradas, eventos y alojamientos en un solo lugar. 
                        Guárdalo todo y llévatelo en el móvil.
                    </p>
                    <div style="display: flex; gap: 15px; justify-content: center; margin-top: 20px;">
                        <a href="/mi-ruta.html" class="btn-rr btn-rr-primary">Ir a Mi Ruta</a>
                        <a href="/registro-turista.html" class="btn-rr btn-rr-outline" style="background: white;">Registrarme gratis</a>
                    </div>
                    <p style="margin-top: 20px; font-size: 0.9rem; color: #666;">Sin spam, solo planes que merecen la pena.</p>
                </div>
            `;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const slug = new URLSearchParams(window.location.search).get('slug') || window.location.pathname.split('/').pop();
            fetchEvento(slug);
        });
    </script>
