<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-X990K5GE42"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-X990K5GE42');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Lugar de Interés - Rutas Rurales</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .edit-section {
            padding: 4rem 2rem;
            background-color: #f9f9f9;
            min-height: calc(100vh - 200px);
            margin-top: 70px;
        }
        .edit-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--primary-color);
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 150px;
            font-family: inherit;
        }
        .btn-save {
            background-color: #27ae60;
            color: white;
            padding: 1rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .btn-save:hover {
            background-color: #219150;
        }
        .preview-img {
            max-width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 0.5rem;
            display: none;
            border: 1px solid #ddd;
        }
        .alert {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            display: none;
        }
        .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <nav class="navbar">
            <div class="container">
                <div class="logo">
                    <img src="logo_990x1076_verde.png" alt="Rutas Logo">
                    <div class="logo-text">
                        <span class="logo-title">Rutas</span>
                        <span class="logo-subtitle">Red Unificada de Turistas, Alojamientos y Servicios</span>
                    </div>
                </div>
                <ul class="nav-menu">
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="lugares-interes-paginacion.html">Lugares de Interés</a></li>
                    <li><a href="dashboard.html">Dashboard</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <section class="edit-section">
        <div class="container">
            <div class="edit-container">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                    <h1><i class="fas fa-edit"></i> Editar Lugar</h1>
                    <a href="lugares-interes-paginacion.html" class="btn-secondary"><i class="fas fa-arrow-left"></i> Volver</a>
                </div>

                <div id="alertMessage" class="alert"></div>

                <form id="editForm">
                    <input type="hidden" id="lugarId" name="id">
                    <input type="hidden" id="slug" name="slug">
                    
                    <div class="form-group">
                        <label for="name">Nombre del Lugar</label>
                        <input type="text" id="name" name="name" required>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label for="municipality">Municipio</label>
                            <input type="text" id="municipality" name="municipality" required>
                        </div>
                        <div class="form-group">
                            <label for="province">Provincia</label>
                            <input type="text" id="province" name="province" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="description">Descripción Completa</label>
                        <textarea id="description" name="description" required></textarea>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label for="entry_fee">Precio Entrada (€)</label>
                            <input type="number" id="entry_fee" name="entry_fee" step="0.01" min="0">
                        </div>
                        <div class="form-group">
                            <label for="visit_duration">Duración Visita (min)</label>
                            <input type="number" id="visit_duration" name="visit_duration" step="15" min="0">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="photo1">URL Foto Principal</label>
                        <input type="url" id="photo1" name="photo1" placeholder="https://..." onchange="previewImage(this.value)">
                        <img id="preview1" class="preview-img">
                    </div>

                    <button type="submit" class="btn-save" id="saveBtn">
                        <i class="fas fa-save"></i> Guardar Cambios
                    </button>
                </form>
            </div>
        </div>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // 1. Verificar Admin
            if (localStorage.getItem('isAdmin') !== 'true' && localStorage.getItem('user_role') !== 'admin') {
                window.location.href = 'login.html';
                return;
            }

            // 2. Obtener Slug y Cargar Datos
            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get('slug');

            if (slug) {
                try {
                    // Reutilizamos la lógica de carga de lugar-interes.html
                    const response = await fetch('api/lugares_interes.php?page=1&limit=1000');
                    const data = await response.json();
                    const lugar = data.data.lugares.find(l => l.slug === slug);

                    if (lugar) {
                        document.getElementById('lugarId').value = lugar.id;
                        document.getElementById('slug').value = lugar.slug;
                        document.getElementById('name').value = lugar.name;
                        document.getElementById('municipality').value = lugar.municipality;
                        document.getElementById('province').value = lugar.province;
                        document.getElementById('description').value = lugar.description || '';
                        document.getElementById('entry_fee').value = lugar.entry_fee;
                        document.getElementById('visit_duration').value = lugar.visit_duration;
                        document.getElementById('photo1').value = lugar.photo1 || '';
                        
                        if(lugar.photo1) previewImage(lugar.photo1);
                    }
                } catch (error) {
                    console.error('Error cargando datos:', error);
                }
            }

            // 3. Manejar Guardado
            document.getElementById('editForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                const btn = document.getElementById('saveBtn');
                const alertBox = document.getElementById('alertMessage');
                
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Guardando...';
                alertBox.style.display = 'none';

                // Recopilar datos
                const formData = new FormData(this);
                const data = {};
                formData.forEach((value, key) => data[key] = value);

                try {
                    const response = await fetch('api/actualizar_lugar.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });

                    // Primero obtenemos el texto crudo para verificar si es JSON válido
                    const text = await response.text();
                    let result;
                    
                    try {
                        result = JSON.parse(text);
                    } catch (e) {
                        console.error('Respuesta del servidor no es JSON:', text);
                        throw new Error('El servidor devolvió una respuesta inválida (posiblemente error 404 o 500). Revisa la consola.');
                    }

                    if (result.success) {
                        alertBox.className = 'alert alert-success';
                        alertBox.textContent = '✅ Cambios guardados correctamente';
                        alertBox.style.display = 'block';
                        // Esperar un poco antes de redirigir
                        setTimeout(() => window.location.href = `lugar-interes.html?slug=${data.slug}`, 2000);
                    } else {
                        throw new Error(result.error || 'Error al guardar en el servidor');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alertBox.className = 'alert alert-error';
                    alertBox.textContent = '❌ Error: ' + error.message;
                    alertBox.style.display = 'block';
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-save"></i> Guardar Cambios';
                }
            });
        });

        function previewImage(url) {
            const img = document.getElementById('preview1');
            if (url) {
                img.src = url;
                img.style.display = 'block';
            } else {
                img.style.display = 'none';
            }
        }
    </script>
</body>
</html>
