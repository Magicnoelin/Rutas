<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - Rutas Rurales</title>
    <link rel="icon" href="/menu_images/Favicon.png" type="image/png">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f5f7f2;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .reset-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            padding: 2.5rem;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-container img {
            height: 80px;
            width: auto;
        }

        h1 {
            color: #2F5233;
            text-align: center;
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #2F5233;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            border-color: #2F5233;
            outline: none;
        }

        .password-requirements {
            margin-top: 0.5rem;
            font-size: 0.9rem;
            color: #666;
        }

        .password-requirements ul {
            padding-left: 1.2rem;
            margin: 0.5rem 0;
        }

        .password-requirements li {
            margin-bottom: 0.3rem;
        }

        .password-requirements .valid {
            color: #28a745;
        }

        .password-requirements .invalid {
            color: #dc3545;
        }

        button {
            width: 100%;
            padding: 1rem;
            background-color: #2F5233;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #1f3a21;
        }

        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        .error-message {
            color: #dc3545;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            padding: 0.8rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            display: none;
        }

        .success-message {
            color: #155724;
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            padding: 0.8rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            display: none;
        }

        .back-to-login {
            text-align: center;
            margin-top: 2rem;
            color: #666;
        }

        .back-to-login a {
            color: #2F5233;
            text-decoration: none;
            font-weight: 600;
        }

        .back-to-login a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .reset-container {
                padding: 1.5rem;
            }

            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="logo-container">
            <img src="/menu_images/Logo%20transparente.webp" alt="Rutas Rurales Logo">
        </div>

        <h1>Restablecer Contraseña</h1>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <form id="resetPasswordForm">
            <input type="hidden" id="token" name="token">
            <input type="hidden" id="email" name="email">

            <div class="form-group">
                <label for="newPassword">Nueva Contraseña</label>
                <input type="password" id="newPassword" name="newPassword" required
                       placeholder="Introduce tu nueva contraseña"
                       minlength="8">
                <div class="password-requirements">
                    <p>La contraseña debe cumplir:</p>
                    <ul>
                        <li id="length" class="invalid">Mínimo 8 caracteres</li>
                        <li id="uppercase" class="invalid">Al menos 1 mayúscula</li>
                        <li id="lowercase" class="invalid">Al menos 1 minúscula</li>
                        <li id="number" class="invalid">Al menos 1 número</li>
                        <li id="special" class="invalid">Al menos 1 carácter especial (!@#$%^&*)</li>
                    </ul>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmar Contraseña</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required
                       placeholder="Confirma tu nueva contraseña">
                <div id="passwordMatch" style="font-size: 0.9rem; margin-top: 0.5rem; display: none;">
                    <i class="fas fa-check-circle" style="color: #28a745;"></i> Las contraseñas coinciden
                </div>
                <div id="passwordMismatch" style="font-size: 0.9rem; margin-top: 0.5rem; display: none;">
                    <i class="fas fa-exclamation-circle" style="color: #dc3545;"></i> Las contraseñas no coinciden
                </div>
            </div>

            <button type="submit" id="resetButton" disabled>Restablecer Contraseña</button>
        </form>

        <div class="back-to-login">
            <p>¿Recordaste tu contraseña? <a href="/login.html">Iniciar sesión</a></p>
        </div>
    </div>

    <script>
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const email = urlParams.get('email');

        // Set hidden fields
        document.getElementById('token').value = token;
        document.getElementById('email').value = email;

        // Check if token and email are present
        if (!token || !email) {
            showError('Enlace de recuperación inválido. Por favor, solicita un nuevo enlace.');
            document.getElementById('resetPasswordForm').style.display = 'none';
        }

        // Password validation
        const newPassword = document.getElementById('newPassword');
        const confirmPassword = document.getElementById('confirmPassword');
        const resetButton = document.getElementById('resetButton');

        newPassword.addEventListener('input', validatePassword);
        confirmPassword.addEventListener('input', validatePasswordMatch);

        function validatePassword() {
            const password = newPassword.value;
            const length = password.length >= 8;
            const hasUppercase = /[A-Z]/.test(password);
            const hasLowercase = /[a-z]/.test(password);
            const hasNumber = /[0-9]/.test(password);
            const hasSpecial = /[!@#$%^&*]/.test(password);

            document.getElementById('length').className = length ? 'valid' : 'invalid';
            document.getElementById('uppercase').className = hasUppercase ? 'valid' : 'invalid';
            document.getElementById('lowercase').className = hasLowercase ? 'valid' : 'invalid';
            document.getElementById('number').className = hasNumber ? 'valid' : 'invalid';
            document.getElementById('special').className = hasSpecial ? 'valid' : 'invalid';

            // Enable/disable reset button based on password strength and match
            const isStrong = length && hasUppercase && hasLowercase && hasNumber && hasSpecial;
            const passwordsMatch = confirmPassword.value === password && password.length > 0;

            resetButton.disabled = !(isStrong && passwordsMatch);
        }

        function validatePasswordMatch() {
            const password = newPassword.value;
            const confirm = confirmPassword.value;

            if (confirm.length > 0) {
                if (password === confirm) {
                    document.getElementById('passwordMatch').style.display = 'block';
                    document.getElementById('passwordMismatch').style.display = 'none';
                } else {
                    document.getElementById('passwordMatch').style.display = 'none';
                    document.getElementById('passwordMismatch').style.display = 'block';
                }
            } else {
                document.getElementById('passwordMatch').style.display = 'none';
                document.getElementById('passwordMismatch').style.display = 'none';
            }

            // Update button state
            validatePassword();
        }

        // Form submission
        document.getElementById('resetPasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const button = e.target.querySelector('button');
            const originalText = button.textContent;
            button.textContent = 'Procesando...';
            button.disabled = true;

            try {
                const response = await fetch('/api/reset_password.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        token: token,
                        email: email,
                        new_password: newPassword.value
                    })
                });

                const result = await response.json();

                if (result.success) {
                    showSuccess(result.message);
                    // Redirect to login after 3 seconds
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 3000);
                } else {
                    showError(result.error || 'Error al restablecer la contraseña');
                    button.textContent = originalText;
                    button.disabled = false;
                }
            } catch (error) {
                showError('Error de conexión. Por favor, inténtalo de nuevo.');
                button.textContent = originalText;
                button.disabled = false;
            }
        });

        function showError(message) {
            const errorElement = document.getElementById('errorMessage');
            errorElement.textContent = message;
            errorElement.style.display = 'block';
        }

        function showSuccess(message) {
            const successElement = document.getElementById('successMessage');
            successElement.innerHTML = `
                <i class="fas fa-check-circle"></i> ${message}
                <p style="margin-top: 0.5rem;">Redirigiendo a la página de inicio de sesión...</p>
            `;
            successElement.style.display = 'block';
            document.getElementById('resetPasswordForm').style.display = 'none';
        }
    </script>
</body>
</html>
