<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad Turística</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="https://kit.fontawesome.com/a076d05399.js"></script>
</head>
<body>
    <header>
        <!-- Header content -->
    </header>

    <main id="actividadContent" style="display: none;">
        <div id="loading">Cargando...</div>
        <div id="error" style="display: none;">Ocurrió un error al cargar la actividad.</div>

        <section class="actividad-header">
            <!-- Image carousel will be inserted here -->
    </section>

        <div id="secInformacion">
            <h2>Información Importante</h2>
            <p id="actividadIncluye"></p>
            <p id="actividadNoIncluye"></p>
            <p id="actividadRequisitos"></p>
            <p id="actividadQueLlevar"></p>
            <p id="actividadEquipo"></p>
                </div>

        <div id="secUbicacion">
            <h2>Ubicación</h2>
            <p id="actividadPuntoEncuentro"></p>
            <section class="mapa-ubicacion" id="actividadMapa"></section>
                </div>

        <div id="secDisponibilidad">
            <h2>Disponibilidad</h2>
            <p id="actividadTemporadas"></p>
            <p id="actividadDias"></p>
            <pre id="actividadHorario"></pre>
                </div>

        <section id="secResumen">
            <h2>Descripción</h2>
            <div id="actividadDescripcion"></div>
        </section>

        <section class="botones-accion">
            <button id="btnReserva" style="display: none;">Ir a la reserva</button>
            <button id="btnContacto" style="display: none;">Contáctanos</button>
        </section>

        <div id="secAgregarRuta">
            <button onclick="addToMyRouteFromDetail()">Añadir a Mi Ruta Personal</button>
            </div>
    </main>
    <script>
        // Original code remains largely unchanged except for URL handling
        const urlParams = new URLSearchParams(window.location.search);
        let slug = urlParams.get('slug');

        // SUGGESTED EDIT: Correct domain to https://rutasrurales.io/
        if (window.location.protocol === 'http:') {
            window.location.replace(window.location.href.replace("http:", "https:"));
        }
    </script>
</body>
</html>
