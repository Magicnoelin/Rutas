    <script>
        let todosLosLugares = [];
        let lugaresFiltrados = [];
        let filtroCategorias = [];

        window.addEventListener('DOMContentLoaded', cargarLugares);

        async function cargarLugares() {
            try {
                const response = await fetch('/api/lugares-interes.php');
                const data = await response.json();
                if (data.success && data.data) {
                    todosLosLugares = data.data;
                    lugaresFiltrados = [...todosLosLugares];
                    console.log('Cargados', todosLosLugares.length, 'lugares desde API');
                    inicializarFiltros();
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('lugaresGrid').style.display = 'grid';
                    mostrarLugares();
                } else {
                    document.getElementById('loading').innerHTML = '<i class="fas fa-exclamation-triangle"></i> Error al cargar';
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('loading').innerHTML = '<i class="fas fa-exclamation-triangle"></i> Error al cargar';
            }
        }

        function inicializarFiltros() {
            // Populate province dropdown dynamically
            const provinciaSelect = document.getElementById('filterProvincia');
            const existingOptions = Array.from(provinciaSelect.options).map(opt => opt.value);
            
            // Get unique provinces from data
            const uniqueProvinces = [...new Set(todosLosLugares.map(lugar => lugar.provincia).filter(p => p))];
            
            // Add missing provinces
            uniqueProvinces.forEach(provincia => {
                if (!existingOptions.includes(provincia)) {
                    const option = document.createElement('option');
                    option.value = provincia;
                    option.textContent = provincia;
                    provinciaSelect.appendChild(option);
                }
            });
            
            // Sort provinces alphabetically (keeping "Todas" first)
            const options = Array.from(provinciaSelect.options);
            const todasOption = options.shift(); // Remove "Todas"
            options.sort((a, b) => a.textContent.localeCompare(b.textContent));
            provinciaSelect.innerHTML = '';
            provinciaSelect.appendChild(todasOption);
            options.forEach(opt => provinciaSelect.appendChild(opt));

            document.getElementById('filterProvincia').addEventListener('change', aplicarFiltros);
            let searchTimeout;
            document.getElementById('filterSearch').addEventListener('input', function() {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(aplicarFiltros, 300);
            });

            // Event listeners for all category buttons
            document.getElementById('filterBodegas').addEventListener('click', function() { toggleCategoria(18, this); });
            document.getElementById('filterRestauracion').addEventListener('click', function() { toggleCategoria(19, this); });
            document.getElementById('filterMonumentos').addEventListener('click', function() { toggleCategoria(1, this); });
            document.getElementById('filterCastillos').addEventListener('click', function() { toggleCategoria(2, this); });
            document.getElementById('filterIglesias').addEventListener('click', function() { toggleCategoria(3, this); });
            document.getElementById('filterErmitas').addEventListener('click', function() { toggleCategoria(4, this); });
            document.getElementById('filterMonasterios').addEventListener('click', function() { toggleCategoria(5, this); });
            document.getElementById('filterNaturaleza').addEventListener('click', function() { toggleCategoria(6, this); });
            document.getElementById('filterMiradores').addEventListener('click', function() { toggleCategoria(7, this); });
            document.getElementById('filterParques').addEventListener('click', function() { toggleCategoria(8, this); });
            document.getElementById('filterRios').addEventListener('click', function() { toggleCategoria(9, this); });
            document.getElementById('filterBosques').addEventListener('click', function() { toggleCategoria(10, this); });
            document.getElementById('filterPatrimonio').addEventListener('click', function() { toggleCategoria(11, this); });
            document.getElementById('filterMuseos').addEventListener('click', function() { toggleCategoria(12, this); });
            document.getElementById('filterYacimientos').addEventListener('click', function() { toggleCategoria(13, this); });
            document.getElementById('filterCentros').addEventListener('click', function() { toggleCategoria(14, this); });
            document.getElementById('filterPueblos').addEventListener('click', function() { toggleCategoria(15, this); });
            document.getElementById('filterConjuntos').addEventListener('click', function() { toggleCategoria(16, this); });
            document.getElementById('filterVillas').addEventListener('click', function() { toggleCategoria(17, this); });
        }

        function toggleCategoria(categoriaId, button) {
            const index = filtroCategorias.indexOf(categoriaId);
            if (index > -1) {
                filtroCategorias.splice(index, 1);
                button.classList.remove('active');
            } else {
                filtroCategorias.push(categoriaId);
                button.classList.add('active');
            }
            aplicarFiltros();
        }

        function aplicarFiltros() {
            const provincia = document.getElementById('filterProvincia').value;
            const search = document.getElementById('filterSearch').value.toLowerCase().trim();

            lugaresFiltrados = todosLosLugares.filter(lugar => {
                const lugarProvincia = (lugar.provincia || '').toLowerCase().trim();
                const cumpleProvincia = !provincia || lugarProvincia === provincia.toLowerCase();

                const texto = (lugar.nombre || '').toLowerCase() + ' ' +
                              (lugar.descripcion || '').toLowerCase() + ' ' +
                              (lugar.localidad || '').toLowerCase();
                const cumpleSearch = !search || texto.includes(search);

                const cumpleCategorias = filtroCategorias.length === 0 || filtroCategorias.includes(lugar.categoria);

                return cumpleProvincia && cumpleSearch && cumpleCategorias;
            });

            mostrarLugares();
        }

        function mostrarLugares() {
            const grid = document.getElementById('lugaresGrid');
            const noResults = document.getElementById('noResults');
            grid.innerHTML = '';

            if (lugaresFiltrados.length === 0) {
                grid.style.display = 'none';
                noResults.style.display = 'block';
                document.getElementById('statsText').textContent = '0 lugares encontrados';
                return;
            }

            grid.style.display = 'grid';
            noResults.style.display = 'none';
            document.getElementById('statsText').innerHTML = '<i class="fas fa-landmark"></i> ' + lugaresFiltrados.length + ' lugares';

            lugaresFiltrados.forEach(lugar => {
                const card = crearTarjeta(lugar);
                grid.appendChild(card);
            });
        }

        function crearTarjeta(lugar) {
            const card = document.createElement('div');
            card.className = 'card';

            const fotos = lugar.fotos || [];
            const foto = fotos.length > 0 ? fotos[0] : 'interest_places_images/Patrocinio.webp';
            const descripcion = (lugar.descripcion_corta || lugar.descripcion || 'Sin descripción').substring(0, 150);
            const precio = lugar.precio || 'Entrada gratuita';

            card.innerHTML = `
                <img src="${foto}" alt="${lugar.nombre}" onerror="this.src='interest_places_images/Patrocinio.webp'">
                <div class="card-content">
                    <h3>${lugar.nombre}</h3>
                    <p class="location"><i class="fas fa-map-marker-alt"></i> ${lugar.localidad || ''}, ${lugar.provincia || ''}</p>
                    <p>${descripcion}...</p>
                    <p class="price">${precio}</p>
                    <a href="/lugar/${lugar.slug}" class="btn-primary" style="margin-top: 1rem;">
                        <i class="fas fa-eye"></i> Ver Detalle
                    </a>
                </div>
            `;
            return card;
        }
    </script>
